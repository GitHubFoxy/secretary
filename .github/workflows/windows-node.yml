name: Windows Execution Node acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile actual Windows Node executable
        run: go build -o secretary-node.exe ./cmd/secretary-node
      - name: Test Windows Node configuration
        run: go test ./cmd/secretary-node -run 'TestConfiguredNodeRuntime|TestSelectNodeNativeStore|TestW03NodeDataDirectoryExclusiveOwnership' -count=1
      - name: Windows host protocol, failure, native process and reconnect acceptance
        run: >
          go test ./internal/node
          -run 'TestManagedCodexInventoryAndDoctorRealExecutables|TestWindowsNativeACPProcessStartAndResume|TestWindowsNPMCommandShimStartsAndResumesACP|TestProtocolWorkspaceAcceptsRemoteWindowsPath|TestACPRuntimeResumesExistingSession|TestDaemonPairHeartbeatDrainReconnectReplayDeduplicateAndRevoke|TestServerRestartNodeReconnectDeliversQueuedLateResultExactlyOnce|TestReplacementSocketInvalidatesWorkerUntilMatchingHeartbeat'
          -count=1 -timeout=10m -v
      - name: Verify Windows ACP process-tree cancellation
        run: go test ./internal/acp -run '^TestACPWindows' -count=1 -timeout=3m -v
      - name: Verify supported ordinary Windows Node installer and upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-node'
          $workspace=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-workspace'
          $existing=Join-Path $data 'identity.json'
          $deployment=Join-Path $data 'config.json'
          $state=Join-Path $data 'node-state.json'
          New-Item -ItemType Directory -Path $data,$workspace -Force | Out-Null
          [IO.File]::WriteAllText($existing,'EXISTING-NODE-PAIRING-MUST-SURVIVE')
          [IO.File]::WriteAllText($deployment,'EXISTING-NODE-CONFIG-MUST-SURVIVE')
          [IO.File]::WriteAllText($state,'EXISTING-NODE-STATE-MUST-SURVIVE')
          $before=(Get-FileHash $existing -Algorithm SHA256).Hash
          $configBefore=(Get-FileHash $deployment -Algorithm SHA256).Hash
          $stateBefore=(Get-FileHash $state -Algorithm SHA256).Hash
          go build -ldflags '-buildid=w03-node-v1' -o (Join-Path $env:RUNNER_TEMP 'w03-node-v1.exe') ./cmd/secretary-node
          if ($LASTEXITCODE -ne 0) { throw 'Node v1 fixture build failed' }
          go build -ldflags '-H=windowsgui -buildid=w03-tray-v1' -o (Join-Path $env:RUNNER_TEMP 'w03-tray-v1.exe') ./cmd/secretary-tray
          if ($LASTEXITCODE -ne 0) { throw 'Tray v1 fixture build failed' }
          go build -ldflags '-buildid=w03-node-v2' -o (Join-Path $env:RUNNER_TEMP 'w03-node-v2.exe') ./cmd/secretary-node
          if ($LASTEXITCODE -ne 0) { throw 'Node v2 fixture build failed' }
          go build -ldflags '-H=windowsgui -buildid=w03-tray-v2' -o (Join-Path $env:RUNNER_TEMP 'w03-tray-v2.exe') ./cmd/secretary-tray
          if ($LASTEXITCODE -ne 0) { throw 'Tray v2 fixture build failed' }
          & ./scripts/install-windows-node.ps1 -NodeDataDir $data -NodeBinary (Join-Path $env:RUNNER_TEMP 'w03-node-v1.exe') -TrayBinary (Join-Path $env:RUNNER_TEMP 'w03-tray-v1.exe')
          if (-not $?) { throw 'Windows first install failed' }
          $linkPath=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Secretary Node.lnk'
          if (-not (Test-Path -LiteralPath $linkPath)) { throw 'Windows Start/Search shortcut missing' }
          $shell=New-Object -ComObject WScript.Shell
          $link=$shell.CreateShortcut($linkPath)
          if (-not (Test-Path $link.TargetPath) -or $link.Arguments -notlike '*--data-dir*') { throw 'Windows tray shortcut has invalid target/Node data directory' }
          $installedTray=$link.TargetPath
          $installedHash=(Get-FileHash -LiteralPath $installedTray -Algorithm SHA256).Hash
          $runningTray=Start-Process -FilePath $installedTray -ArgumentList ('--data-dir "'+$data+'"') -PassThru
          Start-Sleep -Milliseconds 700
          if ($runningTray.HasExited) { throw 'Installed tray failed to launch before upgrade' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class SecretaryTrayWindow {
           [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
           [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hwnd, uint msg, IntPtr wp, IntPtr lp);
           [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
           [DllImport("user32.dll")] public static extern IntPtr GetWindow(IntPtr hwnd, uint command);
          }
          '@
          & ./scripts/install-windows-node.ps1 -NodeDataDir $data -NodeBinary (Join-Path $env:RUNNER_TEMP 'w03-node-v2.exe') -TrayBinary (Join-Path $env:RUNNER_TEMP 'w03-tray-v2.exe')

          if (-not $?) { throw 'Windows idempotent upgrade failed' }
          $upgradeLink=$shell.CreateShortcut($linkPath)
          if ($upgradeLink.TargetPath -eq $installedTray -or
              $installedHash -eq (Get-FileHash -LiteralPath $upgradeLink.TargetPath -Algorithm SHA256).Hash) {
            throw 'Windows tray upgrade did not switch executable versions'
          }
          Start-Sleep -Milliseconds 500
          $runningTray.Refresh()
          if (-not $runningTray.HasExited) { throw 'Old tray process survived upgrade' }
          $upgradeProcesses=@(Get-CimInstance Win32_Process -Filter "Name='secretary-tray.exe'" | Where-Object { $_.ExecutablePath -eq $upgradeLink.TargetPath })
          if ($upgradeProcesses.Count -ne 1) { throw 'Updated installed tray did not relaunch exactly once' }
          if ($configBefore -ne (Get-FileHash $deployment -Algorithm SHA256).Hash -or
              $stateBefore -ne (Get-FileHash $state -Algorithm SHA256).Hash) {
            throw 'Windows upgrade changed Node deployment configuration or state'
          }
          if ($before -ne (Get-FileHash $existing -Algorithm SHA256).Hash) {
            throw 'Windows upgrade modified Node identity'
          }
          if (Test-Path -LiteralPath (Join-Path $data 'worker-account.json')) { throw 'Installer created obsolete Worker account settings' }
      - name: Verify installer on stock Windows PowerShell 5.1 without pwsh
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $scriptText = Get-Content -LiteralPath ./scripts/install-windows-node.ps1 -Raw
          if ($scriptText -match 'pwsh\\.exe|ConvertFrom-Json\\s+-AsHashtable') { throw 'Installer requires PowerShell 7' }
          $node = Join-Path $env:RUNNER_TEMP 't09-ps51-clean-node'
          New-Item -ItemType Directory -Force -Path $node | Out-Null
          & ./scripts/install-windows-node.ps1 -NodeDataDir $node -NodeBinary (Join-Path $PWD 'secretary-node.exe') -TrayBinary (Join-Path $env:RUNNER_TEMP 'w03-tray-v1.exe')
          if (-not $?) { throw 'PowerShell 5.1 clean install failed' }
          if (Test-Path (Join-Path $node 'worker-account.json')) { throw 'Unexpected Worker account provisioning' }
          if ($scriptText -match '-Verb RunAs|setup-windows-worker|check-worker-sandbox') { throw 'Installer requires sandbox elevation or preflight' }
      - name: Verify direct Windows identity, environment, host-file access and cancellation
        run: go test ./internal/nativeexec -run '^TestDirect' -count=1 -timeout=3m -v

  windows-tray:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows tray live status and lifecycle tests
        run: go test ./cmd/secretary-tray -run 'TestW02|TestW03|TestThemeSelection|TestStopWithoutOwnedNode|TestManagedNodeLifecycleAndUnrelatedProcess|TestActualTraySecondLaunchDoesNotSpawnNode' -count=1 -timeout=10m -v
      - name: Windows tray login, logs and integration tests
        run: go test ./cmd/secretary-tray -run 'TestW03|TestActualTraySecondLaunchDoesNotSpawnNode|TestManagedNodeLifecycleAndUnrelatedProcess' -count=1 -timeout=10m -v
      - name: Windows tray and Node builds
        run: |
          go build ./cmd/secretary-node
          go build ./cmd/secretary-tray
