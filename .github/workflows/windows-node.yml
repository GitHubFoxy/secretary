name: Windows Execution Node acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile actual Windows Node executable
        run: go build -o secretary-node.exe ./cmd/secretary-node
      - name: Test Windows Node configuration
        run: go test ./cmd/secretary-node -run 'TestConfiguredNodeRuntime|TestSelectNodeNativeStore' -count=1
      - name: Windows host protocol, failure, native process and reconnect acceptance
        run: >
          go test ./internal/node
          -run 'TestWindowsNativeACPProcessStartAndResume|TestWindowsNPMCommandShimStartsAndResumesACP|TestProtocolWorkspaceAcceptsRemoteWindowsPath|TestACPRuntimeResumesExistingSession|TestDaemonPairHeartbeatDrainReconnectReplayDeduplicateAndRevoke|TestServerRestartNodeReconnectDeliversQueuedLateResultExactlyOnce|TestReplacementSocketInvalidatesWorkerUntilMatchingHeartbeat'
          -count=1 -timeout=10m -v
      - name: Verify supported ordinary Windows Node installer and upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-node'
          $workspace=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-workspace'
          $workerProfile=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-home'
          $existing=Join-Path $data 'identity.json'
          New-Item -ItemType Directory -Path $data,$workspace -Force | Out-Null
          [IO.File]::WriteAllText($existing,'EXISTING-NODE-PAIRING-MUST-SURVIVE')
          $before=(Get-FileHash $existing -Algorithm SHA256).Hash
          & ./scripts/install-windows-node.ps1 -NodeDataDir $data -Workspace $workspace -WorkerHome $workerProfile -WorkerUsername 'secretary_inst_ci' -NodeBinary (Join-Path $PWD 'secretary-node.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows first install failed' }
          $configPath=Join-Path $data 'worker-account.json'
          $first=(Get-Content $configPath -Raw | ConvertFrom-Json)
          & ./scripts/install-windows-node.ps1 -NodeDataDir $data -Workspace $workspace -WorkerHome $workerProfile -WorkerUsername 'secretary_inst_ci' -NodeBinary (Join-Path $PWD 'secretary-node.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows idempotent upgrade failed' }
          $second=(Get-Content $configPath -Raw | ConvertFrom-Json)
          if ($first.password -ne $second.password -or $before -ne (Get-FileHash $existing -Algorithm SHA256).Hash) {
            throw 'Windows upgrade rotated account credentials or Node identity'
          }
          # Verify actual native Start -> Resume using the account installed by
          # the supported installer, not only the separately seeded CI SID.
          foreach ($provider in @('.codex','.claude','opencode-native')) {
            New-Item -ItemType Directory -Path (Join-Path $workerProfile $provider) -Force | Out-Null
          }
          $env:SECRETARY_WORKER_USERNAME = $second.username
          $env:SECRETARY_WORKER_PASSWORD = $second.password
          $env:SECRETARY_WORKER_DOMAIN = $second.domain
          $env:SECRETARY_WORKER_HOME = $workerProfile
          $env:SECRETARY_WORKER_TEST_WORKSPACE = $workspace
          $env:SECRETARY_WORKER_TEST_PROTECTED_DIR = $data
          go test ./internal/nativeexec -run '^TestT09WindowsSeparateAccountStateAndResume
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'secretary_worker_ci'
          $password = 'T09-ci-Safe1!'
          net user $worker $password /add | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'could not provision Windows test Worker account' }
          $principal = "$($env:COMPUTERNAME)\$worker"
          $workerHome = Join-Path $env:RUNNER_TEMP 't09-worker-home'
          $workspace = Join-Path $env:RUNNER_TEMP 't09-worker-workspace'
          $protected = Join-Path $env:RUNNER_TEMP 't09-node-private'
          foreach ($p in @($workerHome,$workspace,$protected)) { New-Item -ItemType Directory -Path $p -Force | Out-Null }
          foreach ($p in @($workerHome,$workspace)) {
            & icacls $p /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" "$($principal):(OI)(CI)M" 'SYSTEM:(OI)(CI)F' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "could not grant Worker access to $p" }
          }
          & icacls $protected /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" 'SYSTEM:(OI)(CI)F' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'could not seal Node secret directory' }
          foreach ($provider in @('.codex','.claude','opencode-native')) {
            New-Item -ItemType Directory -Path (Join-Path $workerHome $provider) -Force | Out-Null
          }
          $env:SECRETARY_WORKER_USERNAME = $worker
          $env:SECRETARY_WORKER_PASSWORD = $password
          $env:SECRETARY_WORKER_DOMAIN = '.'
          $env:SECRETARY_WORKER_HOME = $workerHome
          $env:SECRETARY_WORKER_TEST_WORKSPACE = $workspace
          $env:SECRETARY_WORKER_TEST_PROTECTED_DIR = $protected
          go test ./internal/nativeexec -run 'TestT09WindowsSeparateAccountStateAndResume|TestT09WindowsCancelKillsNativeWorkerTree|TestT09WindowsNativeProviderStateMigrationPreservesHistory|TestT09WindowsPersistedAccountConfigWithoutEnvironment|TestT09WindowsPreexistingEmptyProviderDirectoriesAreMigrated|TestT09WindowsProjectlessWorkspaceStaysInProvisionedWorkerHome' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'native Worker security and resume acceptance failed' }
 -count=1 -timeout=3m -v
          if ($LASTEXITCODE -ne 0) { throw 'installer-created Worker SID did not preserve native Start/Resume' }
      - name: Verify native Workers use a separate Windows security principal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'secretary_worker_ci'
          $password = 'T09-ci-Safe1!'
          net user $worker $password /add | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'could not provision Windows test Worker account' }
          $principal = "$($env:COMPUTERNAME)\$worker"
          $workerHome = Join-Path $env:RUNNER_TEMP 't09-worker-home'
          $workspace = Join-Path $env:RUNNER_TEMP 't09-worker-workspace'
          $protected = Join-Path $env:RUNNER_TEMP 't09-node-private'
          foreach ($p in @($workerHome,$workspace,$protected)) { New-Item -ItemType Directory -Path $p -Force | Out-Null }
          foreach ($p in @($workerHome,$workspace)) {
            & icacls $p /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" "$($principal):(OI)(CI)M" 'SYSTEM:(OI)(CI)F' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "could not grant Worker access to $p" }
          }
          & icacls $protected /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" 'SYSTEM:(OI)(CI)F' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'could not seal Node secret directory' }
          foreach ($provider in @('.codex','.claude','opencode-native')) {
            New-Item -ItemType Directory -Path (Join-Path $workerHome $provider) -Force | Out-Null
          }
          $env:SECRETARY_WORKER_USERNAME = $worker
          $env:SECRETARY_WORKER_PASSWORD = $password
          $env:SECRETARY_WORKER_DOMAIN = '.'
          $env:SECRETARY_WORKER_HOME = $workerHome
          $env:SECRETARY_WORKER_TEST_WORKSPACE = $workspace
          $env:SECRETARY_WORKER_TEST_PROTECTED_DIR = $protected
          go test ./internal/nativeexec -run 'TestT09WindowsSeparateAccountStateAndResume|TestT09WindowsCancelKillsNativeWorkerTree|TestT09WindowsNativeProviderStateMigrationPreservesHistory|TestT09WindowsPersistedAccountConfigWithoutEnvironment|TestT09WindowsPreexistingEmptyProviderDirectoriesAreMigrated|TestT09WindowsProjectlessWorkspaceStaysInProvisionedWorkerHome' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'native Worker security and resume acceptance failed' }
