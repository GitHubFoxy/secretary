name: Windows Execution Node acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile actual Windows Node executable
        run: go build -o secretary-node.exe ./cmd/secretary-node
      - name: Test Windows Node configuration
        run: go test ./cmd/secretary-node -run 'TestConfiguredNodeRuntime|TestSelectNodeNativeStore' -count=1
      - name: Windows host protocol, failure, native process and reconnect acceptance
        run: >
          go test ./internal/node
          -run 'TestWindowsNativeACPProcessStartAndResume|TestWindowsNPMCommandShimStartsAndResumesACP|TestProtocolWorkspaceAcceptsRemoteWindowsPath|TestACPRuntimeResumesExistingSession|TestDaemonPairHeartbeatDrainReconnectReplayDeduplicateAndRevoke|TestServerRestartNodeReconnectDeliversQueuedLateResultExactlyOnce|TestReplacementSocketInvalidatesWorkerUntilMatchingHeartbeat'
          -count=1 -timeout=10m -v
      - name: Verify supported ordinary Windows Node installer and upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-node'
          $workspace=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-workspace'
          $workerProfile=Join-Path $env:RUNNER_TEMP 't09-installer-upgrade-home'
          $existing=Join-Path $data 'identity.json'
          New-Item -ItemType Directory -Path $data,$workspace -Force | Out-Null
          [IO.File]::WriteAllText($existing,'EXISTING-NODE-PAIRING-MUST-SURVIVE')
          $before=(Get-FileHash $existing -Algorithm SHA256).Hash
          go build -ldflags '-buildid=w03-node-v1' -o (Join-Path $env:RUNNER_TEMP 'w03-node-v1.exe') ./cmd/secretary-node
          if ($LASTEXITCODE -ne 0) { throw 'Node v1 fixture build failed' }
          go build -ldflags '-H=windowsgui -buildid=w03-tray-v1' -o (Join-Path $env:RUNNER_TEMP 'w03-tray-v1.exe') ./cmd/secretary-tray
          if ($LASTEXITCODE -ne 0) { throw 'Tray v1 fixture build failed' }
          go build -ldflags '-buildid=w03-node-v2' -o (Join-Path $env:RUNNER_TEMP 'w03-node-v2.exe') ./cmd/secretary-node
          if ($LASTEXITCODE -ne 0) { throw 'Node v2 fixture build failed' }
          go build -ldflags '-H=windowsgui -buildid=w03-tray-v2' -o (Join-Path $env:RUNNER_TEMP 'w03-tray-v2.exe') ./cmd/secretary-tray
          if ($LASTEXITCODE -ne 0) { throw 'Tray v2 fixture build failed' }
          & ./scripts/install-windows-node.ps1 -NodeDataDir $data -Workspace $workspace -WorkerHome $workerProfile -WorkerUsername 'secretary_inst_ci' -NodeBinary (Join-Path $env:RUNNER_TEMP 'w03-node-v1.exe') -TrayBinary (Join-Path $env:RUNNER_TEMP 'w03-tray-v1.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows first install failed' }
          $linkPath=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Secretary Node.lnk'
          if (-not (Test-Path -LiteralPath $linkPath)) { throw 'Windows Start/Search shortcut missing' }
          $shell=New-Object -ComObject WScript.Shell
          $link=$shell.CreateShortcut($linkPath)
          if (-not (Test-Path $link.TargetPath) -or $link.Arguments -notlike '*--data-dir*') { throw 'Windows tray shortcut has invalid target/Node data directory' }
          $installedTray=$link.TargetPath
          $installedHash=(Get-FileHash -LiteralPath $installedTray -Algorithm SHA256).Hash
          $configPath=Join-Path $data 'worker-account.json'
          $first=(Get-Content $configPath -Raw | ConvertFrom-Json)
          $runningTray=Start-Process -FilePath $installedTray -ArgumentList ('--data-dir "'+$data+'"') -PassThru
          Start-Sleep -Milliseconds 700
          if ($runningTray.HasExited) { throw 'Installed tray failed to launch before upgrade' }
          & ./scripts/install-windows-node.ps1 -NodeDataDir $data -Workspace $workspace -WorkerHome $workerProfile -WorkerUsername 'secretary_inst_ci' -NodeBinary (Join-Path $env:RUNNER_TEMP 'w03-node-v2.exe') -TrayBinary (Join-Path $env:RUNNER_TEMP 'w03-tray-v2.exe')

          if ($LASTEXITCODE -ne 0) { throw 'Windows idempotent upgrade failed' }
          $second=(Get-Content $configPath -Raw | ConvertFrom-Json)
          $upgradeLink=$shell.CreateShortcut($linkPath)
          if ($upgradeLink.TargetPath -eq $installedTray -or
              $installedHash -eq (Get-FileHash -LiteralPath $upgradeLink.TargetPath -Algorithm SHA256).Hash) {
            throw 'Windows tray upgrade did not switch executable versions'
          }
          Start-Sleep -Milliseconds 500
          $runningTray.Refresh()
          if (-not $runningTray.HasExited) { throw 'Old tray process survived upgrade' }
          if ($first.password -ne $second.password -or $before -ne (Get-FileHash $existing -Algorithm SHA256).Hash) {
            throw 'Windows upgrade rotated account credentials or Node identity'
          }
          # Native Start and Resume run using the actual SID provisioned by
          # install-windows-node.ps1, not only the separately seeded test SID.
          foreach ($provider in @('.codex','.claude','opencode-native')) {
            New-Item -ItemType Directory -Path (Join-Path $workerProfile $provider) -Force | Out-Null
          }
          $env:SECRETARY_WORKER_USERNAME = $second.username
          $env:SECRETARY_WORKER_PASSWORD = $second.password
          $env:SECRETARY_WORKER_DOMAIN = $second.domain
          $env:SECRETARY_WORKER_HOME = $workerProfile
          $env:SECRETARY_WORKER_TEST_WORKSPACE = $workspace
          $env:SECRETARY_WORKER_TEST_PROTECTED_DIR = $data
          go test ./internal/nativeexec -run TestT09WindowsSeparateAccountStateAndResume -count=1 -timeout=3m -v
          if ($LASTEXITCODE -ne 0) { throw 'installer-created Worker SID did not preserve native Start/Resume' }
      - name: Verify installer on stock Windows PowerShell 5.1 without pwsh
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $scriptText = Get-Content -LiteralPath ./scripts/install-windows-node.ps1 -Raw
          if ($scriptText -match 'pwsh\\.exe|ConvertFrom-Json\\s+-AsHashtable') { throw 'Installer requires PowerShell 7' }
          $node = Join-Path $env:RUNNER_TEMP 't09-ps51-clean-node'
          $workerHomePath = Join-Path $env:RUNNER_TEMP 't09-ps51-clean-home'
          $workspace = Join-Path $env:RUNNER_TEMP 't09-ps51-clean-workspace'
          New-Item -ItemType Directory -Force -Path $node,$workspace | Out-Null
          & ./scripts/install-windows-node.ps1 -NodeDataDir $node -WorkerHome $workerHomePath -Workspace $workspace -WorkerUsername 'secretary_ps51_ci' -NodeBinary (Join-Path $PWD 'secretary-node.exe')
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 clean install failed' }
          if (-not (Test-Path (Join-Path $node 'worker-account.json'))) { throw 'Worker SID was not provisioned' }
      - name: Verify native Workers use a separate Windows security principal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = 'secretary_worker_ci'
          $password = 'T09-ci-Safe1!'
          $nodeBinary=Join-Path $env:RUNNER_TEMP 'w03-worker-node.exe'
          go build -o $nodeBinary ./cmd/secretary-node
          if ($LASTEXITCODE -ne 0) { throw 'could not build Windows Node for installer' }
          $installData=Join-Path $env:RUNNER_TEMP 'w03-worker-install-node'
          $installWorkspace=Join-Path $env:RUNNER_TEMP 'w03-worker-install-workspace'
          $installHome=Join-Path $env:RUNNER_TEMP 'w03-worker-install-home'
          New-Item -ItemType Directory -Path $installData,$installWorkspace -Force | Out-Null
          & ./scripts/install-windows-node.ps1 -NodeDataDir $installData -Workspace $installWorkspace -WorkerHome $installHome -WorkerUsername $worker -NodeBinary $nodeBinary
          if ($LASTEXITCODE -ne 0) { throw 'supported Worker install failed' }
          $password=(Get-Content -LiteralPath (Join-Path $installData 'worker-account.json') -Raw | ConvertFrom-Json).password
          $principal = "$($env:COMPUTERNAME)\$worker"
          $workerHome = Join-Path $env:RUNNER_TEMP 't09-worker-home'
          $workspace = Join-Path $env:RUNNER_TEMP 't09-worker-workspace'
          $protected = Join-Path $env:RUNNER_TEMP 't09-node-private'
          foreach ($p in @($workerHome,$workspace,$protected)) { New-Item -ItemType Directory -Path $p -Force | Out-Null }
          foreach ($p in @($workerHome,$workspace)) {
            & icacls $p /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" "$($principal):(OI)(CI)M" 'SYSTEM:(OI)(CI)F' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "could not grant Worker access to $p" }
          }
          & icacls $protected /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" 'SYSTEM:(OI)(CI)F' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'could not seal Node secret directory' }
          foreach ($provider in @('.codex','.claude','opencode-native')) {
            New-Item -ItemType Directory -Path (Join-Path $workerHome $provider) -Force | Out-Null
          }
          $env:SECRETARY_WORKER_USERNAME = $worker
          $env:SECRETARY_WORKER_PASSWORD = $password
          $env:SECRETARY_WORKER_DOMAIN = '.'
          $env:SECRETARY_WORKER_HOME = $workerHome
          $env:SECRETARY_WORKER_TEST_WORKSPACE = $workspace
          $env:SECRETARY_WORKER_TEST_PROTECTED_DIR = $protected
          go test ./internal/nativeexec -run 'TestT09WindowsSeparateAccountStateAndResume|TestT09WindowsCancelKillsNativeWorkerTree|TestT09WindowsNativeProviderStateMigrationPreservesHistory|TestT09WindowsPersistedAccountConfigWithoutEnvironment|TestT09WindowsPreexistingEmptyProviderDirectoriesAreMigrated|TestT09WindowsProjectlessWorkspaceStaysInProvisionedWorkerHome' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'native Worker security and resume acceptance failed' }

  windows-tray:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows tray live status and lifecycle tests
        run: go test ./cmd/secretary-tray -run 'TestW02|TestW03|TestThemeSelection|TestStopWithoutOwnedNode|TestManagedNodeLifecycleAndUnrelatedProcess|TestActualTraySecondLaunchDoesNotSpawnNode' -count=1 -timeout=10m -v
      - name: Windows tray login, logs and integration tests
        run: go test ./cmd/secretary-tray -run 'TestW03|TestActualTraySecondLaunchDoesNotSpawnNode|TestManagedNodeLifecycleAndUnrelatedProcess' -count=1 -timeout=10m -v
      - name: Windows tray and Node builds
        run: |
          go build ./cmd/secretary-node
          go build ./cmd/secretary-tray
