name: macOS binary Secretary release

on:
  pull_request:
    paths:
      - secretary
      - macos/SecretaryNode/**
      - scripts/install-macos-binary.sh
      - scripts/installer-tls-retry-test.sh
      - scripts/install-macos-standalone-node.sh
      - scripts/macos-standalone-node-test.sh
      - scripts/macos-standalone-clean-install-test.sh
      - cmd/secretary-node/**
      - internal/node/codex_*.go
      - scripts/build-codex-acp-bundle.sh
      - internal/acp/jsonl.go
      - internal/nativeexec/**
      - internal/node/**
      - internal/ctl/**
      - internal/app/**
      - internal/webapi/**
      - internal/acp/**
      - cmd/secretaryd/**
      - internal/node/harness_probe.go
      - internal/webapi/video.go
      - internal/webapi/video_tools.go
      - internal/webapi/video_tools_test.go
      - scripts/provision-server-video-tools.sh
      - scripts/package-macos-binary-release.sh
      - scripts/video-tools-contract-test.sh
      - scripts/video-doctor-contract-test.sh
      - scripts/macos-release-contract-test.sh
      - scripts/macos-binary-install-test.sh
      - .github/workflows/macos-binary-release.yml
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  package-and-install:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Package contract checks
        shell: bash
        run: |
          bash -n scripts/package-macos-binary-release.sh
          bash -n scripts/install-macos-binary.sh
          bash -n scripts/install-macos-standalone-node.sh
          bash -n scripts/macos-standalone-node-test.sh
          bash -n scripts/macos-standalone-clean-install-test.sh
          bash -n scripts/macos-release-contract-test.sh
          bash scripts/macos-release-contract-test.sh
          zsh -n secretary
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Cache ACP builder npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: acp-npm-v2.2.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-codex-acp-bundle.sh') }}
      - name: Cache verified native ACP bundle
        id: acp-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-acp
          key: codex-acp-v2.2.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-codex-acp-bundle.sh') }}
      - name: Compile pinned modern Codex ACP (builder only)
        if: steps.acp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-codex-acp-bundle.sh darwin-arm64 "$RUNNER_TEMP/native-acp"
      - name: Cache verified video tools
        id: video-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/server-video-tools
          key: ffmpeg-static-b6.1.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/provision-server-video-tools.sh') }}
      - name: Provision video tools on release builder
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.video-cache.outputs.cache-hit }}" == true ]]; then
            (cd "$RUNNER_TEMP/server-video-tools" && shasum -a 256 -c .cache-sha256)
          else
            bash scripts/provision-server-video-tools.sh "$RUNNER_TEMP/server-video-tools"
            (cd "$RUNNER_TEMP/server-video-tools" && shasum -a 256 ffmpeg ffprobe > .cache-sha256)
          fi
          ffmpeg_version="$("$RUNNER_TEMP/server-video-tools/ffmpeg" -version | head -n 1 | awk '{print $3}')"
          ffprobe_version="$("$RUNNER_TEMP/server-video-tools/ffprobe" -version | head -n 1 | awk '{print $3}')"
          [[ -n "$ffmpeg_version" && "$ffmpeg_version" == "$ffprobe_version" ]]
          "$RUNNER_TEMP/server-video-tools/ffmpeg" -encoders | grep libwebp
          echo "$RUNNER_TEMP/server-video-tools" >> "$GITHUB_PATH"
      - name: Build native release on CI host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secretary-package/bin" "$RUNNER_TEMP/secretary-package/scripts" "$RUNNER_TEMP/secretary-package/internal/config"
          mkdir -p "$RUNNER_TEMP/secretary-package/bin/native-acp"
          cp "$RUNNER_TEMP/native-acp/"* "$RUNNER_TEMP/secretary-package/bin/native-acp/"
          for binary in secretaryd secretaryctl secretary-mcp secretary-migrate secretary-node; do
            go build -trimpath -o "$RUNNER_TEMP/secretary-package/bin/$binary" "./cmd/$binary"
          done
          swift test --package-path macos/SecretaryNode
          swift build --package-path macos/SecretaryNode -c release
          mkdir -p "$RUNNER_TEMP/secretary-package/Secretary Node.app/Contents/MacOS"
          cp macos/SecretaryNode/.build/release/SecretaryNode "$RUNNER_TEMP/secretary-package/Secretary Node.app/Contents/MacOS/SecretaryNode"
          cp macos/SecretaryNode/Info.plist "$RUNNER_TEMP/secretary-package/Secretary Node.app/Contents/Info.plist"
          package_version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then package_version=0.0.0; fi
          plutil -replace CFBundleShortVersionString -string "$package_version" "$RUNNER_TEMP/secretary-package/Secretary Node.app/Contents/Info.plist"
          codesign --force --sign - "$RUNNER_TEMP/secretary-package/Secretary Node.app"
          codesign --verify "$RUNNER_TEMP/secretary-package/Secretary Node.app"
          mkdir -p "$RUNNER_TEMP/secretary-package/bin/video-tools"
          cp "$RUNNER_TEMP/server-video-tools/ffmpeg" "$RUNNER_TEMP/secretary-package/bin/video-tools/ffmpeg"
          cp "$RUNNER_TEMP/server-video-tools/ffprobe" "$RUNNER_TEMP/secretary-package/bin/video-tools/ffprobe"
          cp secretary "$RUNNER_TEMP/secretary-package/secretary"
          cp scripts/secretary-interactive.zsh "$RUNNER_TEMP/secretary-package/scripts/secretary-interactive.zsh"
          cp -R internal/config/defaults "$RUNNER_TEMP/secretary-package/internal/config/defaults"
          echo "SECRETARY_PACKAGE_INPUT=$RUNNER_TEMP/secretary-package" >> "$GITHUB_ENV"
      - name: Packaged video dependency contract
        shell: bash
        run: bash scripts/video-tools-contract-test.sh "$RUNNER_TEMP/secretary-package"
      - name: Server video doctor regression
        shell: bash
        run: bash scripts/video-doctor-contract-test.sh
      - name: Real video transcode acceptance
        shell: bash
        run: go test ./internal/webapi -run 'TestT12RealFFmpegNonzeroPTSAndVFRSourcePTS|TestT12FFmpegExtractsExactlyProbedVideoTrackNotDefault|TestVideoToolPairValidation|TestVideoManagedManifestIntegrity|TestVideoRejectsFFmpegWithoutLibWebP' -count=1
      - name: Create versioned archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=0.0.0-ci; fi
          arch="$(uname -m)"
          [[ "$arch" == arm64 ]] || arch=amd64
          bash scripts/package-macos-binary-release.sh "$version" "$GITHUB_SHA" "$arch" "$SECRETARY_PACKAGE_INPUT" "$RUNNER_TEMP/secretary-dist"
          echo "SECRETARY_TEST_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/secretary-test-dist"
          cp "$RUNNER_TEMP/secretary-dist/"* "$RUNNER_TEMP/secretary-test-dist/"
          echo "SECRETARY_TEST_DIST=$RUNNER_TEMP/secretary-test-dist" >> "$GITHUB_ENV"
      - name: Cache verified official Codex native archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codex-native/codex.tar.gz
          key: codex-native-rust-v0.163.0-${{ runner.os }}-${{ runner.arch }}
      - name: Real bundled modern ACP initialize / new / load / steering gate
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/actual-release-acp"
          mkdir -p "$dest"
          tar -xzf "$RUNNER_TEMP/secretary-dist/secretary-v${SECRETARY_TEST_VERSION}-darwin-arm64.tar.gz" -C "$dest"
          package="$dest/secretary-v${SECRETARY_TEST_VERSION}-darwin-arm64"
          mkdir -p "$dest/adapter"
          (cd "$package/bin/native-acp" && shasum -a 256 -c codex-acp.tar.gz.sha256)
          tar -xzf "$package/bin/native-acp/codex-acp.tar.gz" -C "$dest/adapter"
          mv "$dest/adapter/codex-acp-2.2.2" "$dest/adapter/codex-acp"
          chmod +x "$dest/adapter/codex-acp"
          triple=aarch64-apple-darwin
          expected=61c4d9a92521bdb42b0c1d9f87c673f6da628a06de5945cbdd9a0010632f6d10
          mkdir -p "$RUNNER_TEMP/codex-native"
          if [[ ! -f "$RUNNER_TEMP/codex-native/codex.tar.gz" ]]; then
            curl -fLsS --retry 3 -o "$RUNNER_TEMP/codex-native/codex.tar.gz" "https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-$triple.tar.gz"
          fi
          echo "$expected  $RUNNER_TEMP/codex-native/codex.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/codex-native/codex.tar.gz" -C "$dest/adapter"
          host_digest=2e28f49a4767a97586843c92692b96481be74d837199b49038f731cec88e9941
          if [[ ! -f "$dest/codex-code-mode-host.tar.gz" ]]; then
            curl -fLsS --retry 3 -o "$dest/codex-code-mode-host.tar.gz" "https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-code-mode-host-$triple.tar.gz"
          fi
          echo "$host_digest  $dest/codex-code-mode-host.tar.gz" | shasum -a 256 -c -
          tar -xzf "$dest/codex-code-mode-host.tar.gz" -C "$dest/adapter"
          test -s "$dest/adapter/codex-code-mode-host-$triple"
          chmod +x scripts/mock-codex-app-server.py
          python3 scripts/codex-acp-release-gate.py --acp "$dest/adapter/codex-acp" --codex "$dest/adapter/codex-$triple" --mock-app-server "$GITHUB_WORKSPACE/scripts/mock-codex-app-server.py"
      - name: Verify clean install, idempotence, failed activation and upgrade
        shell: bash
        run: |
          bash -n scripts/macos-binary-install-test.sh
          bash scripts/macos-binary-install-test.sh "$SECRETARY_PACKAGE_INPUT" "$SECRETARY_TEST_DIST" "$GITHUB_SHA"
      - name: Standalone macOS Execution Node fixture (not owner live acceptance)
        shell: bash
        run: |
          bash scripts/macos-standalone-node-test.sh "$SECRETARY_TEST_DIST" "$GITHUB_SHA"
          bash scripts/macos-standalone-clean-install-test.sh "$SECRETARY_TEST_DIST"
          go test ./cmd/secretary-node -run TestStandaloneEnrollmentHTTPSAndNoOverwrite -count=1
      - name: TLS handshake interruption retry contract
        shell: bash
        run: bash scripts/installer-tls-retry-test.sh
      - name: Prerelease-tag installer regression
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version=0.1.0-alpha.1
          arch="$(uname -m)"
          [[ "$arch" == arm64 ]] || arch=amd64
          test_dist="$RUNNER_TEMP/prerelease-test-dist"
          bash scripts/package-macos-binary-release.sh "$version" "$GITHUB_SHA" "$arch" "$SECRETARY_PACKAGE_INPUT" "$test_dist"
          export SECRETARY_TEST_VERSION="$version"
          bash scripts/macos-binary-install-test.sh "$SECRETARY_PACKAGE_INPUT" "$test_dist" "$GITHUB_SHA"
          bash scripts/macos-standalone-node-test.sh "$test_dist" "$GITHUB_SHA"
          bash scripts/macos-standalone-clean-install-test.sh "$test_dist"
      - uses: actions/upload-artifact@v4
        with:
          name: secretary-macos-binary-release
          path: ${{ runner.temp }}/secretary-dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-and-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: secretary-macos-binary-release
          path: dist
      - name: Attach versioned artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_flags[@]}"
