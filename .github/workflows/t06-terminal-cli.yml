name: T06 terminal CLI

on:
  push:
    paths:
      - secretary
      - scripts/secretary-interactive.zsh
      - scripts/t06-terminal-cli-test.sh
      - scripts/mac12-linux-node-status-test.sh
      - scripts/install.sh
      - .github/workflows/t06-terminal-cli.yml
  pull_request:
    paths:
      - secretary
      - scripts/secretary-interactive.zsh
      - scripts/t06-terminal-cli-test.sh
      - scripts/mac12-linux-node-status-test.sh
      - scripts/install.sh
      - .github/workflows/t06-terminal-cli.yml

jobs:
  terminal-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Syntax checks
        run: |
          zsh -n secretary
          zsh -n scripts/secretary-interactive.zsh
          zsh -n scripts/mac12-linux-node-status-test.sh
          bash -n scripts/install.sh
          bash -n scripts/t06-terminal-cli-test.sh
      - name: CLI integration tests
        run: |
          bash scripts/t06-terminal-cli-test.sh
          zsh scripts/mac12-linux-node-status-test.sh
