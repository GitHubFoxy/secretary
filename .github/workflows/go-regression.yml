name: Secretary Go regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Worker sandbox prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Test Secretary routing and lifecycle
        run: go test ./internal/e2e ./internal/core ./internal/secretary ./internal/mcp ./internal/config ./internal/ctl
