name: Secretary Go regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Export formatted T01 test sources for this PR
        run: |
          gofmt -w internal/e2e/secretary_worker_routing_test.go internal/e2e/secretary_worker_routing_live_test.go
          echo BEGIN_T01_ROUTING_BASE64
          base64 -w0 internal/e2e/secretary_worker_routing_test.go
          echo
          echo END_T01_ROUTING_BASE64
          echo BEGIN_T01_LIVE_BASE64
          base64 -w0 internal/e2e/secretary_worker_routing_live_test.go
          echo
          echo END_T01_LIVE_BASE64
      - name: Test all Go packages
        run: go test ./...
