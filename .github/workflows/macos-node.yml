name: macOS native Worker direct execution acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-node:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test macOS Worker execution, file publication and provider history
        shell: bash
        run: |
          go test ./internal/nativeexec ./internal/node ./internal/core -run 'TestT09' -count=1 -timeout=10m -v
          go test ./internal/nativeexec -run '^TestDirectWorker' -count=1 -timeout=5m -v
          go test ./internal/acp -run '^TestACPCancellationTerminatesNativeDescendants$' -count=1 -timeout=5m -v
          go test ./internal/node -run '^TestMAC02' -count=1 -timeout=3m -v
      - name: Build production macOS Node and Server
        shell: bash
        run: |
          go build ./cmd/secretary-node
          go build ./cmd/secretaryd
      - name: Verify production Node process identity snapshot
        shell: bash
        run: go test ./cmd/secretary-node -run '^TestMAC12PublishNodeProcessIdentity
        shell: bash
        run: zsh scripts/mac12-node-status-test.sh
 -count=1 -v
      - name: Verify app-managed and CLI-managed Node status
        shell: bash
        run: zsh scripts/mac12-node-status-test.sh
