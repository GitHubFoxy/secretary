name: macOS Native Worker sandbox acceptance

on:
  pull_request:
  push:
    branches: [main, feat/t09-worker-publish-artifacts]

permissions:
  contents: read

jobs:
  macos-node:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Confirm available Seatbelt sandbox
        shell: bash
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      - name: Diagnose Seatbelt minimum process permissions (no deployment changes)
        shell: bash
        run: |
          set +e
          for policy in \
            '(version 1)(allow default)' \
            '(version 1)(deny default)(allow process*)(allow file-read*)(allow file-write*)(allow network*)(allow mach-lookup)(allow sysctl-read)(allow mach-host*)(allow iokit-open)(allow ipc-posix*)(allow file-read-metadata)(allow file-ioctl)(allow signal)' \
            '(version 1)(deny default)(allow process*)(allow mach-lookup)(allow sysctl-read)(allow mach-host*)(allow ipc-posix*)(allow file-read-metadata)(allow file-read* (subpath "/System") (subpath "/usr") (subpath "/bin") (subpath "/Library") (subpath "/private/etc") (subpath "/dev"))'; do
            /usr/bin/sandbox-exec -p "$policy" /bin/sh -c 'echo T09-SEATBELT-SHELL-OK'
            echo "Seatbelt diagnostic exit=$?"
          done
          baseline='(version 1)(deny default)(allow process*)(allow network*)(allow mach-lookup)(allow mach-host*)(allow sysctl-read)(allow ipc-posix*)(allow iokit-open)(allow file-read-metadata)(allow file-ioctl)(allow signal)(allow file-read* (subpath "/System") (subpath "/usr") (subpath "/bin") (subpath "/sbin") (subpath "/Library") (subpath "/Applications") (subpath "/private/etc") (subpath "/dev"))'
          for extra in \
            '(allow file-read* (subpath "/private/var"))' \
            '(allow file-read* (subpath "/private/var") (subpath "/Users/runner/work"))' \
            '(allow file-read* (subpath "/private/var") (subpath "/Users"))'; do
            /usr/bin/sandbox-exec -p "${baseline}${extra}" /bin/sh -c 'echo T09-EXTRA-READS-OK'
            echo "Seatbelt extra-path diagnostic exit=$?"
          done
          exit 0
      - name: Diagnose read versus write Seatbelt startup restriction
        shell: bash
        run: |
          set +e
          base='(version 1)(deny default)(allow process*)(allow network*)(allow mach-lookup)(allow mach-host*)(allow sysctl-read)(allow iokit-open)(allow ipc-posix*)(allow file-read-metadata)(allow file-ioctl)(allow signal)'
          reads='(allow file-read* (subpath "/usr"))(allow file-read* (subpath "/System"))(allow file-read* (subpath "/Library"))(allow file-read* (subpath "/bin"))(allow file-read* (subpath "/sbin"))(allow file-read* (subpath "/private/etc"))(allow file-read* (subpath "/private/var"))(allow file-read* (subpath "/Users"))(allow file-read* (subpath "/dev"))'
          for profile in \
            "${base}${reads}(allow file-write*)" \
            "${base}(allow file-read*)(allow file-write* (subpath \"/private/tmp\"))(allow file-write* (literal \"/dev/null\"))" \
            "${base}${reads}(allow file-write*)(allow file-read* (subpath \"/private/tmp\"))"; do
            /usr/bin/sandbox-exec -p "$profile" /bin/sh -c 'echo T09-PROFILE-STARTED'
            echo "Seatbelt read/write diagnostic exit=$?"
          done
          log show --last 2m --style compact --predicate 'eventMessage CONTAINS[c] "sandbox" OR eventMessage CONTAINS[c] "deny"' 2>/dev/null | tail -30 || true
          exit 0
      - name: Diagnose Seatbelt system executable mappings and missing mounts
        shell: bash
        run: |
          set +e
          base='(version 1)(deny default)(allow process*)(allow network*)(allow mach-lookup)(allow mach-host*)(allow sysctl-read)(allow iokit-open)(allow ipc-posix*)(allow file-read-metadata)(allow file-ioctl)(allow signal)'
          readroots='(allow file-read* (subpath "/usr"))(allow file-read* (subpath "/System"))(allow file-read* (subpath "/Library"))(allow file-read* (subpath "/bin"))(allow file-read* (subpath "/sbin"))(allow file-read* (subpath "/private/etc"))(allow file-read* (subpath "/private/var"))(allow file-read* (subpath "/private/tmp"))(allow file-read* (subpath "/Users"))(allow file-read* (subpath "/dev"))'
          for addition in \
            '(allow file-map-executable)' \
            '(allow file-read* (literal "/"))' \
            '(allow file-read* (subpath "/opt"))' \
            '(allow file-read* (subpath "/Volumes"))' \
            '(allow file-read* (subpath "/private"))' \
            '(allow file-read* (subpath "/opt"))(allow file-read* (subpath "/Volumes"))(allow file-read* (literal "/"))(allow file-map-executable)' ; do
            echo "macOS diagnose addition: $addition"
            /usr/bin/sandbox-exec -p "${base}${readroots}(allow file-write*)${addition}" /bin/sh -c 'echo T09-START-PASS'
            echo "exit=$?"
          done
          exit 0
      - name: Test macOS Worker isolation, file publication and provider history
        shell: bash
        run: |
          go test ./internal/nativeexec ./internal/node ./internal/core -run 'TestT09' -count=1 -timeout=10m -v
      - name: Build production macOS Node and Server
        shell: bash
        run: |
          go build ./cmd/secretary-node
          go build ./cmd/secretaryd
