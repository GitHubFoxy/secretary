name: Linux binary Secretary release

on:
  pull_request:
    paths:
      - secretary
      - internal/node/codex_*.go
      - scripts/build-codex-acp-bundle.sh
      - internal/acp/jsonl.go
      - internal/nativeexec/**
      - internal/node/**
      - internal/ctl/**
      - internal/app/**
      - internal/webapi/**
      - internal/acp/**
      - cmd/secretaryd/**
      - internal/node/harness_probe.go
      - scripts/install-linux-binary.sh
      - scripts/installer-tls-retry-test.sh
      - internal/webapi/video.go
      - internal/webapi/video_tools.go
      - internal/webapi/video_tools_test.go
      - scripts/provision-server-video-tools.sh
      - scripts/package-linux-binary-release.sh
      - scripts/video-tools-contract-test.sh
      - scripts/video-doctor-contract-test.sh
      - scripts/linux-binary-install-test.sh
      - .github/workflows/linux-binary-release.yml
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-package-and-install:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Compile pinned modern Codex ACP (builder only)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-codex-acp-bundle.sh linux-${{ matrix.arch }} "$RUNNER_TEMP/native-acp"
      - name: Provision video tools on release builder
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/provision-server-video-tools.sh "$RUNNER_TEMP/server-video-tools"
          "$RUNNER_TEMP/server-video-tools/ffmpeg" -encoders | grep libwebp
          echo "$RUNNER_TEMP/server-video-tools" >> "$GITHUB_PATH"
      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
          bash -n scripts/package-linux-binary-release.sh scripts/install-linux-binary.sh scripts/linux-binary-install-test.sh
          mkdir -p "$RUNNER_TEMP/package/bin" "$RUNNER_TEMP/package/scripts" "$RUNNER_TEMP/package/internal/config"
          for binary in secretaryd secretaryctl secretary-mcp secretary-migrate secretary-node; do
            go build -trimpath -o "$RUNNER_TEMP/package/bin/$binary" "./cmd/$binary"
          done
          mkdir -p "$RUNNER_TEMP/package/bin/native-acp"
          cp "$RUNNER_TEMP/native-acp/"* "$RUNNER_TEMP/package/bin/native-acp/"
          mkdir -p "$RUNNER_TEMP/package/bin/video-tools"
          cp "$RUNNER_TEMP/server-video-tools/ffmpeg" "$RUNNER_TEMP/package/bin/video-tools/ffmpeg"
          cp "$RUNNER_TEMP/server-video-tools/ffprobe" "$RUNNER_TEMP/package/bin/video-tools/ffprobe"
          cp secretary "$RUNNER_TEMP/package/secretary"
          cp scripts/secretary-interactive.zsh "$RUNNER_TEMP/package/scripts/"
          cp -R internal/config/defaults "$RUNNER_TEMP/package/internal/config/"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=0.0.0-ci; fi
          bash scripts/package-linux-binary-release.sh "$version" "$GITHUB_SHA" "${{ matrix.arch }}" "$RUNNER_TEMP/package" "$RUNNER_TEMP/dist"
          echo "SECRETARY_PACKAGE_INPUT=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          echo "SECRETARY_TEST_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/secretary-test-dist"
          cp "$RUNNER_TEMP/dist/"* "$RUNNER_TEMP/secretary-test-dist/"
          echo "SECRETARY_TEST_DIST=$RUNNER_TEMP/secretary-test-dist" >> "$GITHUB_ENV"
      - name: Real bundled modern ACP initialize / new / load / steering gate
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/actual-release-acp"
          mkdir -p "$dest"
          tar -xzf "$RUNNER_TEMP/dist/secretary-v${SECRETARY_TEST_VERSION}-linux-${{ matrix.arch }}.tar.gz" -C "$dest"
          package="$dest/secretary-v${SECRETARY_TEST_VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "$dest/adapter"
          (cd "$package/bin/native-acp" && sha256sum -c codex-acp.tar.gz.sha256)
          tar -xzf "$package/bin/native-acp/codex-acp.tar.gz" -C "$dest/adapter"
          mv "$dest/adapter/codex-acp-2.2.2" "$dest/adapter/codex-acp"
          chmod +x "$dest/adapter/codex-acp"
          case "${{ matrix.arch }}" in
            amd64) triple=x86_64-unknown-linux-musl; expected=beb339e8ecd9ba057a6bb2dc81ad8ca474812edfbf0fc5056ca818797648dde4 ;;
            arm64) triple=aarch64-unknown-linux-musl; expected=a7261e65f4a96d8f4ca65a069c6cf2dc2c33defc341e48078acefda9461fffe4 ;;
          esac
          curl -fLsS --retry 3 -o "$dest/codex.tar.gz" "https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-$triple.tar.gz"
          echo "$expected  $dest/codex.tar.gz" | sha256sum -c -
          tar -xzf "$dest/codex.tar.gz" -C "$dest/adapter"
          case "${{ matrix.arch }}" in
            amd64) host_digest=314263128ba6592e7e807c265deeaf928a692b72dcbfeb5e0b20c9423b703529 ;;
            arm64) host_digest=284356aefb197f00b76b912efdfdbae8ccf3ea1f89b976dde064b7ccb43214ef ;;
          esac
          curl -fLsS --retry 3 -o "$dest/codex-code-mode-host.tar.gz" "https://github.com/openai/codex/releases/download/rust-v0.163.0/codex-code-mode-host-$triple.tar.gz"
          echo "$host_digest  $dest/codex-code-mode-host.tar.gz" | sha256sum -c -
          tar -xzf "$dest/codex-code-mode-host.tar.gz" -C "$dest/adapter"
          test -s "$dest/adapter/codex-code-mode-host-$triple"
          chmod +x scripts/mock-codex-app-server.py
          python3 scripts/codex-acp-release-gate.py --acp "$dest/adapter/codex-acp" --codex "$dest/adapter/codex-$triple" --mock-app-server "$GITHUB_WORKSPACE/scripts/mock-codex-app-server.py"
      - name: Packaged video dependency contract
        shell: bash
        run: bash scripts/video-tools-contract-test.sh "$RUNNER_TEMP/package"
      - name: Server video doctor regression
        shell: bash
        run: bash scripts/video-doctor-contract-test.sh
      - name: Real video transcode acceptance
        shell: bash
        run: go test ./internal/webapi -run 'TestT12RealFFmpegNonzeroPTSAndVFRSourcePTS|TestT12FFmpegExtractsExactlyProbedVideoTrackNotDefault|TestVideoToolPairValidation|TestVideoManagedManifestIntegrity|TestVideoRejectsFFmpegWithoutLibWebP' -count=1
      - name: Clean-user simulated systemd and verified artifact install
        shell: bash
        run: |
          bash scripts/linux-binary-install-test.sh "$SECRETARY_PACKAGE_INPUT" "$SECRETARY_TEST_DIST" "$GITHUB_SHA"
      - name: TLS handshake interruption retry contract
        shell: bash
        run: bash scripts/installer-tls-retry-test.sh
      - name: Prerelease-tag installer regression
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version=0.1.0-alpha.1
          test_dist="$RUNNER_TEMP/prerelease-test-dist"
          bash scripts/package-linux-binary-release.sh "$version" "$GITHUB_SHA" "${{ matrix.arch }}" "$SECRETARY_PACKAGE_INPUT" "$test_dist"
          SECRETARY_TEST_VERSION="$version" bash scripts/linux-binary-install-test.sh "$SECRETARY_PACKAGE_INPUT" "$test_dist" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: secretary-linux-${{ matrix.arch }}-binary-release
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-package-and-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: secretary-linux-*-binary-release
          path: dist
          merge-multiple: true
      - name: Attach Linux assets to existing tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..240}; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 10
          done
          echo 'macOS release publisher did not create the tagged release; refusing to publish orphaned Linux assets' >&2
          exit 1
