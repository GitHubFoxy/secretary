name: Go tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Worker sandbox prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Run Go tests
        run: go test ./...
