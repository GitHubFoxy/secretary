name: Go tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Worker sandbox prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Ubuntu 24+ AppArmor can otherwise block unprivileged userns.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/sh -c 'exit 0'
      - name: Ensure mandatory FFmpeg/ffprobe for video acceptance
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install pinned official Codex distribution and provision verified runtime manifest
        run: |
          npm install --prefix "$RUNNER_TEMP/t09-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.163.0
          sudo env PATH="$PATH" python3 scripts/provision-cli-manifest.py codex 0.163.0
          sudo env PATH="$PATH" python3 scripts/provision-cli-manifest.py codex 0.163.0-linux-x64
      - name: Diagnose protected official CLI store permissions
        run: |
          namei -l /etc/secretary/cli-store/codex/@openai__codex/0.163.0/bin/codex.js
          namei -l /etc/secretary/cli-manifests/codex/@openai__codex/0.163.0.json
      - name: Real Codex package sandbox Start and Resume smoke
        env:
          T09_REAL_CODEX: ${{ runner.temp }}/t09-codex/node_modules/@openai/codex/bin/codex.js
        run: go test ./internal/nativeexec -run TestT09PinnedOfficialCodexStartResume -count=1 -v
      - name: Run Go tests
        run: go test ./...
