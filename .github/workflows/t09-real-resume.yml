name: T09 real Codex same-session Resume acceptance

on:
  pull_request:
    paths:
      - 'internal/nativeexec/**'
      - 'internal/node/**'
      - 'cmd/secretary-node/**'
      - 'scripts/build-codex-acp-bundle.sh'
      - '.github/workflows/t09-real-resume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned official Codex runtime without root provisioning
        run: npm install --prefix "$RUNNER_TEMP/t09-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.163.0
      - name: Start, persist, and resume the SAME Codex session with direct execution
        env:
          T09_REAL_CODEX: ${{ runner.temp }}/t09-codex/node_modules/@openai/codex/bin/codex.js
        run: go test ./internal/nativeexec -run '^TestT09RealCodexPersistedSessionResume$' -count=1 -v -timeout 120s
