name: T09 real Codex same-session Resume acceptance

on:
  pull_request:
    paths:
      - 'internal/nativeexec/**'
      - 'scripts/provision-cli-manifest.py'
      - '.github/workflows/t09-real-resume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -p=1
      T09_REAL_CODEX: ${{ runner.temp }}/t09-codex/node_modules/@openai/codex/bin/codex.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install bubblewrap and enable user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/sh -c 'exit 0'
      - name: Install and verify pinned official Codex runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/t09-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.163.0
          sudo env PATH="$PATH" python3 scripts/provision-cli-manifest.py codex 0.163.0
          sudo env PATH="$PATH" python3 scripts/provision-cli-manifest.py codex 0.163.0-linux-x64
      - name: Start, persist, and resume the SAME Codex session in native sandbox
        run: go test ./internal/nativeexec -run '^TestT09RealCodexPersistedSessionResume$' -count=1 -v -timeout 120s
