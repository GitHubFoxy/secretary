name: Windows standalone Node release verification
on:
  pull_request:
    paths:
      - 'scripts/install-windows-node-release.ps1'
      - 'scripts/install-windows-node.ps1'
      - '.github/workflows/windows-standalone-node.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compile release fixtures in CI
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/secretary-node.exe" ./cmd/secretary-node
          if ($LASTEXITCODE -ne 0) { throw 'Node fixture compilation failed' }
          go build -ldflags '-H=windowsgui' -o "$env:RUNNER_TEMP/secretary-tray.exe" ./cmd/secretary-tray
          if ($LASTEXITCODE -ne 0) { throw 'Tray fixture compilation failed' }
      - name: Verify Windows Codex inventory, pinned ZIP, rollback and launcher restrictions
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/install07-version-fixture.exe" ./scripts/fixtures/install07-native-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture compile failed' }
          $env:SECRETARY_INSTALL07_TEST_EXE = Join-Path $env:RUNNER_TEMP 'install07-version-fixture.exe'
          go test ./internal/node -run '^TestInstall07' -count=1 -timeout=5m -v
          if ($LASTEXITCODE -ne 0) { throw 'Install07 inventory tests failed' }
      - name: Verify release archive contract and installation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root=Join-Path $env:RUNNER_TEMP 'standalone-node-release'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          foreach($name in @('secretary-node.exe','secretary-tray.exe')) {
            Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -Destination (Join-Path $root $name)
          }
          Copy-Item -LiteralPath ./scripts/install-windows-node.ps1,./scripts/setup-windows-worker.ps1 -Destination $root
          $manifest=@{
            schema=1;version='ci-1';platform='windows';arch='amd64'
            node_sha256=(Get-FileHash (Join-Path $root 'secretary-node.exe') -Algorithm SHA256).Hash
            tray_sha256=(Get-FileHash (Join-Path $root 'secretary-tray.exe') -Algorithm SHA256).Hash
          } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $root 'release.json'),$manifest)
          $archive=Join-Path $env:RUNNER_TEMP 'standalone-node.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($root,$archive)
          $wrongArch = Join-Path $env:RUNNER_TEMP 'wrong-architecture.zip'
          $badDir = Join-Path $env:RUNNER_TEMP 'bad-manifest-fixture'
          Copy-Item -LiteralPath $root -Destination $badDir -Recurse
          $badManifest = Get-Content (Join-Path $badDir 'release.json') -Raw | ConvertFrom-Json
          $badManifest.arch = 'arm64'
          [IO.File]::WriteAllText((Join-Path $badDir 'release.json'),($badManifest | ConvertTo-Json -Compress))
          [IO.Compression.ZipFile]::CreateFromDirectory($badDir,$wrongArch)
          $wrongDigest=(Get-FileHash $wrongArch -Algorithm SHA256).Hash
          $componentArchive = Join-Path $env:RUNNER_TEMP 'wrong-component.zip'
          $badManifest.arch = 'amd64'
          $badManifest.node_sha256 = ('f'*64)
          [IO.File]::WriteAllText((Join-Path $badDir 'release.json'),($badManifest | ConvertTo-Json -Compress))
          [IO.Compression.ZipFile]::CreateFromDirectory($badDir,$componentArchive)
          $componentDigest=(Get-FileHash $componentArchive -Algorithm SHA256).Hash
                    $digest=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $uri=([Uri]$archive).AbsoluteUri
          $data=Join-Path $env:RUNNER_TEMP 'standalone-install-data'
          $home=Join-Path $env:RUNNER_TEMP 'standalone-worker-home'
          $workspace=Join-Path $env:RUNNER_TEMP 'standalone-worker-workspace'
          New-Item -ItemType Directory -Path $data,$workspace -Force | Out-Null
          $identity=Join-Path $data 'identity.json'
          [IO.File]::WriteAllText($identity,'PRESERVED-IDENTITY')
          try {
            & ./scripts/install-windows-node-release.ps1 -ReleaseUri $uri -ReleaseSHA256 ('0'*64) -NodeDataDir $data -WorkerHome $home -Workspace $workspace
            throw 'Tampered outer digest was accepted'
          } catch {
            if ($_.Exception.Message -notlike '*independently pinned digest*') { throw }
          }
          if ((Get-Content -LiteralPath $identity -Raw) -ne 'PRESERVED-IDENTITY') { throw 'Negative fixture mutated identity' }
          foreach($bad in @(@($wrongArch,$wrongDigest,'architecture'),@($componentArchive,$componentDigest,'executable hash'))) {
            try {
              & ./scripts/install-windows-node-release.ps1 -ReleaseUri ([Uri]$bad[0]).AbsoluteUri -ReleaseSHA256 $bad[1] -NodeDataDir $data -WorkerHome $home -Workspace $workspace -Harness claude
              throw 'Negative release fixture unexpectedly accepted'
            } catch {
              if ($_.Exception.Message -notlike ('*'+$bad[2]+'*')) { throw }
            }
          }
                    & ./scripts/install-windows-node-release.ps1 -ReleaseUri $uri -ReleaseSHA256 $digest -NodeDataDir $data -WorkerHome $home -Workspace $workspace -WorkerUsername 'secretary_i07_ci' -Harness claude
          if (-not $?) { throw 'Verified archive install failed' }
          if ((Get-Content -LiteralPath $identity -Raw) -ne 'PRESERVED-IDENTITY') { throw 'Verified install mutated identity' }
          $shortcutPath=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Secretary Node.lnk'
          $shell=New-Object -ComObject WScript.Shell
          $originalTarget=$shell.CreateShortcut($shortcutPath).TargetPath
          $originalLinkHash=(Get-FileHash $shortcutPath -Algorithm SHA256).Hash
          try {
            & ./scripts/install-windows-node-release.ps1 -ReleaseUri ([Uri]$componentArchive).AbsoluteUri -ReleaseSHA256 $componentDigest -NodeDataDir $data -WorkerHome $home -Workspace $workspace -WorkerUsername 'secretary_i07_ci' -Harness claude
            throw 'Corrupt upgrade unexpectedly succeeded'
          } catch {
            if ($_.Exception.Message -notlike '*executable hash*') { throw }
          }
          if ((Get-FileHash $shortcutPath -Algorithm SHA256).Hash -ne $originalLinkHash -or $shell.CreateShortcut($shortcutPath).TargetPath -ne $originalTarget) { throw 'Failed upgrade changed Start/Search activation' }
          if ((Get-Content -LiteralPath $identity -Raw) -ne 'PRESERVED-IDENTITY') { throw 'Failed upgrade changed identity' }
                    $identityBefore=(Get-FileHash $identity -Algorithm SHA256).Hash
          $workerAccount=Join-Path $data 'worker-account.json'
          $accountBefore=(Get-FileHash $workerAccount -Algorithm SHA256).Hash
          & ./scripts/install-windows-node-release.ps1 -ReleaseUri $uri -ReleaseSHA256 $digest -NodeDataDir $data -WorkerHome $home -Workspace $workspace -WorkerUsername 'secretary_i07_ci' -Harness claude
          if (-not $?) { throw 'Repeated verified install failed' }
          if ($identityBefore -ne (Get-FileHash $identity -Algorithm SHA256).Hash -or $accountBefore -ne (Get-FileHash $workerAccount -Algorithm SHA256).Hash) { throw 'Repeat install changed identity or Worker account' }
          $shortcut=Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Secretary Node.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start/Search shortcut missing' }
