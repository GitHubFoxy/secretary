name: Issue 209 temporary gofmt export

on:
  pull_request:
    paths:
      - 'internal/node/**'
      - '.github/workflows/issue209-format-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 211
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Export gofmt of PR Go files for connector-only application
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | grep -E '\.go$' | while IFS= read -r file; do
            test -f "$file" || continue
            printf 'FMTBEGIN:%s\n' "$file"
            gofmt "$file" | base64 -w 1500 | sed 's/^/FMTDATA:/'
            printf 'FMTEND:%s\n' "$file"
          done
