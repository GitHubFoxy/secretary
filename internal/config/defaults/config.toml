skills = []

[profiles]
secretary = "profiles/secretary.md"
worker = "profiles/worker.md"
child_worker = "profiles/child-worker.md"

[tools]
allow_tools = ["bash", "edit", "find", "grep", "read", "write"]

# Left-hand keys are stable aliases. Replace the values with model IDs supported by your harness.
# `default` delegates model selection to the harness.
[models]
secretary = "gpt-5.6-luna"
fast = "fast"
smart = "smart"
cheap = "cheap"

[secretary]
harness = "fx"
model = "gpt-5.6-luna"
reasoning = "default"

[worker_policy]
default_harness = "fx"
preferred_harnesses = ["fx", "claude_code", "codex"]
active_attempts = 4

# Legacy compatibility for older readers.
[runtime]
harness = "fx"
reasoning = "default"

[retention]
raw_logs = "720h"
raw_log_max_bytes = 1073741824
