skills = []

[profiles]
secretary = "profiles/secretary.md"
worker = "profiles/worker.md"
child_worker = "profiles/child-worker.md"

[tools]
allow_tools = ["bash", "edit", "find", "grep", "read", "write"]

# Secretary and new Workers have independent explicit model/reasoning defaults.
[models]
secretary = "default"

[secretary]
harness = "codex"
model = "default"
reasoning = "default"
# Явное включение addressed reply v1 меняет MCP contract; после настройки перезапустите Secretary.
# reply_contract = "addressed-reply-v1"

[worker_policy]
default_harness = "codex"
model = "default"
reasoning = "default"
preferred_harnesses = ["codex", "claude_code"]
active_attempts = 4

# Названия из сохранённого Worker title или Task prompt; дополнительная модель не вызывается.
# Остальные title_* поля сохранены для совместимости исторической конфигурации.
[telegram]
title_harness = "deterministic"
title_prompt = "title-generation-prompt.md"
title_model = "gpt-6-luna"
# Допустимы none, minimal, low, medium, high, xhigh. Поддержка зависит от provider.
title_model_reasoning = "minimal"

[retention]
raw_logs = "720h"
raw_log_max_bytes = 1073741824
