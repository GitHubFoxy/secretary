skills = []

[profiles]
secretary = "profiles/secretary.md"
worker = "profiles/worker.md"
child_worker = "profiles/child-worker.md"

[tools]
allow_tools = ["bash", "edit", "find", "grep", "read", "write"]

# Secretary uses an explicit model pin. Worker profiles use the harness default
# unless a concrete model is configured in a profile policy.
[models]
secretary = "gpt-5.6-luna"

[secretary]
harness = "fx"
model = "gpt-5.6-luna"
reasoning = "default"

[worker_policy]
default_harness = "fx"
preferred_harnesses = ["fx", "claude_code", "codex"]
active_attempts = 4

# Только названия Telegram Worker Topics; Secretary и Worker profiles не меняются.
[telegram]
title_harness = "opencode"
title_prompt = "title-generation-prompt.md"
title_model = "gpt-6-luna"
# Допустимы none, minimal, low, medium, high, xhigh. Поддержка зависит от provider.
title_model_reasoning = "minimal"

[retention]
raw_logs = "720h"
raw_log_max_bytes = 1073741824
