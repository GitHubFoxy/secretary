schema_version: 1
target_release: v0.0.1

# Each matrix expands into required case instances. Actual OS, harness and channel
# are recorded with the exact candidate SHA in the result JSON.
scope:
  server_os: [linux, macos]
  node_os: [linux, macos, windows]
  harnesses: [codex, claude_code]
  telegram_channels: [telegram_dm, telegram_general, telegram_worker_topic]
  telegram_media: [photo, video, audio, voice_message]
  excluded:
    - windows_server
    - telegram_non_forum_groups
    - native_pdf_parsing_in_secretary
    - realtime_voice_conversation
    - mandatory_pwa_install
    - semantic_memory
    - managed_skills_registry
    - cron_automation

cases:
  - id: INSTALL-SERVER-01
    group: install
    title: Fresh server install from published binary
    matrix:
      server_os: [linux, macos]
    steps:
      - Install the published candidate as a normal user without source checkout or manual package repair.
      - Finish terminal setup with one authenticated native harness; start the service and run doctor.
      - Verify the running executable revision and archive checksum match the candidate.
    pass:
      - Published package boots and doctor reports actual readiness without a false PASS.
      - Running server revision equals the recorded candidate SHA.

  - id: INSTALL-NODE-01
    group: install
    title: Fresh execution node enrollment
    matrix:
      node_os: [linux, macos, windows]
    steps:
      - Install the official published node package on a clean supported host.
      - Pair with a supported Linux or macOS server and inspect node doctor and inventory.
    pass:
      - Node is online and reports the actual host, harness readiness and revision.
      - No source build or manual modification of the release payload was required.

  - id: INSTALL-UPGRADE-01
    group: install
    title: Upgrade without losing existing state
    matrix:
      server_os: [linux, macos]
    steps:
      - Record the previous installation's version, conversation, Worker and Artifact IDs.
      - Upgrade from the previous available candidate using the documented installation path.
      - Restart the service and inspect retained identities and data.
    pass:
      - Upgrade completes without manual file repair or data loss.
      - Existing conversation, Workers and Artifacts remain accessible.

  - id: INSTALL-DOCTOR-01
    group: install
    title: Missing or unsupported harness diagnostics
    matrix:
      server_os: [linux, macos]
    steps:
      - Run setup and doctor with an absent CLI, absent authentication and a configured unsupported model.
      - Restore a supported authenticated native harness.
    pass:
      - Each unavailable capability is reported as unavailable with an actionable reason.
      - Valid pre-existing configuration is not destroyed by a failed setup.

  - id: NODE-WORKER-01
    group: node
    title: Real Worker lifecycle and same-session follow-up
    matrix:
      node_os: [linux, macos, windows]
      harness: [codex, claude_code]
    steps:
      - On the named real OS and harness, ask Secretary to delegate a task requiring a real native command.
      - Make the Worker ask a question as a terminal Result, then answer it as a Follow-up.
      - Switch topics between turns and verify the same Worker and native session resumes.
    pass:
      - Exactly one Worker is created and each Attempt has one truthful terminal Result.
      - Follow-up uses the original Worker, native session and workspace; executed command output is verified.

  - id: NODE-CANCEL-01
    group: node
    title: Cancel terminates native work and descendants
    matrix:
      node_os: [linux, macos, windows]
      harness: [codex, claude_code]
    steps:
      - Start a real long-running child command and cancel the Worker attempt.
      - Inspect the actual native child-process tree and resulting terminal event.
    pass:
      - Native command and descendants stop without orphaned work.
      - Exactly one canceled Result exists and no hidden retry occurs.

  - id: NODE-FAILURE-01
    group: node
    title: Native command failure and explicit recovery truth
    matrix:
      node_os: [linux, macos, windows]
      harness: [codex, claude_code]
    steps:
      - Run a command that exits nonzero and verify the failure Result and error reason.
      - In a separate attempt explicitly request recovery and verify real command events and final status.
      - Supply quoted failure-looking JSON as data to check for false error attribution.
    pass:
      - Failed native execution is never reported as succeeded.
      - Recovery outcome matches native evidence; quoted data alone does not cause failure.

  - id: NODE-RESUME-01
    group: node
    title: Restart and native session resume
    matrix:
      node_os: [linux, macos, windows]
      harness: [codex, claude_code]
    steps:
      - Record native session ID and a context marker from a real Worker.
      - Restart the execution node and server, then send a Follow-up to that Worker.
    pass:
      - Same Worker and recoverable native session retain the marker and workspace.
      - Missing native session is reported as unavailable rather than silently recreated.

  - id: NODE-RECONNECT-01
    group: node
    title: Offline node and reconnect safety
    matrix:
      node_os: [linux, macos, windows]
    steps:
      - Disconnect a paired node and submit a Worker action.
      - Reconnect the node and replay the relevant request or event once.
    pass:
      - Offline or uncertain execution is disclosed and not blindly retried.
      - No duplicate attempt, command or Result appears after reconnect.

  - id: NODE-STEER-01
    group: node
    title: Busy Worker steering versus explicit queued follow-up
    matrix:
      harness: [codex, claude_code]
    steps:
      - Send direct input to a busy Worker and separately send an explicit /q message.
      - Inspect actual steering support, queued FIFO delivery and Worker history.
    pass:
      - Unsupported immediate steering is explicit and never silently converted to a queue.
      - Queued messages retain order and are delivered as later Follow-ups.

  - id: TG-DM-01
    group: telegram
    title: Owner-only Telegram DM without a group
    matrix:
      channel: [telegram_dm]
    steps:
      - Configure Telegram with no group and pair the real owner identity.
      - Send two DM turns; receive Secretary replies and one delegated Worker Result.
    pass:
      - DM-alone setup works and messages appear once in canonical conversation.
      - Unpaired accounts cannot command Secretary.

  - id: TG-GENERAL-01
    group: telegram
    title: Optional forum General mirror
    matrix:
      channel: [telegram_general]
    steps:
      - Pair a real forum supergroup and exchange messages in DM and General.
      - Inspect canonical message IDs, mirrored replies and model turns.
    pass:
      - DM and General are views of the same conversation.
      - Mirrored events never trigger duplicate harness turns or Results.

  - id: TG-TOPIC-01
    group: telegram
    title: Worker Topic routes only to its Worker
    matrix:
      channel: [telegram_worker_topic]
    steps:
      - Create a Worker and its forum Topic; send a direct message and a queued follow-up there.
      - Reconnect Telegram and inspect topic projection and canonical Worker identity.
    pass:
      - Input reaches the intended Worker only, not a separate Secretary conversation.
      - Replayed updates do not produce duplicate commands or Results.

  - id: TG-MEDIA-IN-01
    group: telegram
    title: Receive photo, video, audio and voice messages
    matrix:
      channel: [telegram_dm, telegram_general, telegram_worker_topic]
      media: [photo, video, audio, voice_message]
    steps:
      - Send a real supported media message through the selected Telegram channel.
      - Inspect accepted bytes, Artifact identity, derivatives and Worker availability.
    pass:
      - Original reaches the central store intact and is addressable by the intended Worker.
      - Required processing or transcript state is correct or its failure is disclosed.

  - id: TG-FILE-OUT-01
    group: telegram
    title: Return Worker-produced files to Telegram
    matrix:
      channel: [telegram_dm, telegram_general, telegram_worker_topic]
    steps:
      - Make a Worker publish a new file and deliver it to the selected Telegram view.
      - Download it and compare size and SHA256 with the published Artifact.
    pass:
      - The actual file, not a local path or invented attachment, reaches the owner once.
      - Bytes match the stored Artifact.

  - id: TG-OWNER-01
    group: telegram
    title: Forum membership never grants execution authority
    matrix:
      channel: [telegram_general, telegram_worker_topic]
    steps:
      - Attempt a command from another forum member without the owner's pairing.
    pass:
      - No Worker action, session access or owner-only data disclosure is permitted.

  - id: TG-MEDIA-ERROR-01
    group: telegram
    title: Oversized and failed media are visibly rejected
    matrix:
      media: [photo, video, audio, voice_message]
    steps:
      - Send media beyond configured limits or trigger a controlled processing failure.
    pass:
      - Owner sees the true limit or processing failure; no truncated or fictitious analysis is claimed.

  - id: WEB-CHAT-01
    group: web
    title: Conversation in desktop and mobile browsers
    matrix:
      client: [desktop_browser, mobile_browser]
    steps:
      - Authenticate using existing bootstrap/session flow and exchange Secretary messages.
      - Refresh or reconnect and inspect chat order and identity.
    pass:
      - User can chat without installing a PWA; messages survive reload and appear once.

  - id: WEB-WORKER-01
    group: web
    title: Worker creation, observer and follow-up
    matrix:
      client: [desktop_browser, mobile_browser]
    steps:
      - Create and inspect a Worker including a projectless Worker.
      - Open observer/history and send a direct message or Follow-up.
    pass:
      - UI shows the correct Worker identity, state and Result.
      - Follow-up reaches the same Worker without a fabricated Project requirement.

  - id: WEB-FILES-01
    group: web
    title: Files move in both directions
    matrix:
      media: [photo, video, audio, document]
    steps:
      - Upload the selected file in Web, pass it to a Worker and publish an output file.
      - Download both original and output from Web and compare hashes.
    pass:
      - Worker receives the real Artifact and output is downloadable with matching bytes.
      - Secretary does not claim to implement the harness's native PDF understanding.

  - id: WEB-AUTH-01
    group: web
    title: Web owner session and authorization
    matrix:
      client: [desktop_browser, mobile_browser]
    steps:
      - Test valid session persistence and unauthenticated access to conversation and Workers.
    pass:
      - Authorized owner session remains usable across page reload.
      - Anonymous requests cannot read or modify owner state.

  - id: MEDIA-TG-WORKER-01
    group: media
    title: End-to-end Telegram voice to Worker and file reply
    matrix:
      harness: [codex, claude_code]
    steps:
      - On any recorded supported Node OS, send an actual Telegram voice message to Secretary.
      - Verify transcription or an honest unsupported state, native Worker receipt and a file reply.
    pass:
      - Original voice, derived text and actual Worker context are traceable by Artifact IDs.
      - Returned file bytes match the published Artifact and the result is delivered once.

  - id: MEDIA-WEB-WORKER-01
    group: media
    title: End-to-end Web attachment through both harnesses
    matrix:
      harness: [codex, claude_code]
    steps:
      - Upload a normal file from Web and have a native Worker read or manipulate it.
      - Publish a resulting Artifact and fetch it again through Web.
    pass:
      - Both transfers preserve bytes and ownership.
      - Interpretation of PDF/document content is performed by the native harness.

  - id: MEDIA-VIDEO-01
    group: media
    title: Video originals, sampled frames and timestamps
    matrix:
      channel: [telegram_dm, web]
    steps:
      - Upload a real video, configure a frame sampling rate and inspect original and derivatives.
      - Check frame timestamps and the Worker-visible references.
    pass:
      - Original is intact and frame count/timestamps obey effective configuration.
      - Unavailable video/audio processing is explicit, not claimed successful.

  - id: RECOVERY-SERVER-01
    group: recovery
    title: Server restart preserves canonical conversation and Workers
    matrix:
      server_os: [linux, macos]
    steps:
      - Record conversation, Worker, Attempt and Result IDs.
      - Restart the production-like server and inspect the same entries afterward.
    pass:
      - State survives restart with no loss, duplication or invented completion.

  - id: RECOVERY-ARTIFACT-01
    group: recovery
    title: Persisted originals and published results survive restarts
    matrix:
      server_os: [linux, macos]
    steps:
      - Record original, derivative and published Artifact IDs and SHA256 values.
      - Restart server and node, then retrieve all stored files.
    pass:
      - All committed Artifacts remain accessible and downloaded hashes match.
      - Worker archive does not silently delete retained files.

  - id: RECOVERY-REPLAY-01
    group: recovery
    title: Reconnect and idempotent event replay
    matrix:
      server_os: [linux, macos]
    steps:
      - Replay a Telegram/Web event or an idempotency-keyed Worker request after reconnect.
    pass:
      - Canonical message and Result IDs stay stable; no duplicate native side effects.
