<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secretary</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <section id="login" class="card">
      <h1>Secretary</h1>
      <p>Open your Personal Conversation.</p>
      <form id="login-form">
        <label>Bootstrap token <input id="bootstrap-token" type="password" autocomplete="off" required></label>
        <button>Sign in</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="conversation-view" hidden>
      <header class="topbar"><h1>Personal Conversation</h1><span id="connection-state">offline</span></header>
      <div id="entries" class="entries" aria-live="polite"></div>
      <form id="message-form" class="composer">
        <input id="message" autocomplete="off" placeholder="Tell Secretary what to do" required>
        <button>Send</button>
      </form>
      <p id="message-error" class="error" hidden></p>
      <section class="card worker-panel">
        <h2>Worker observer</h2>
        <form id="worker-form">
          <label>Worker reference <input id="worker-ref" autocomplete="off" placeholder="worker id" required></label>
          <button>Open observer</button>
        </form>
        <div id="worker-observer" hidden>
          <p>Status: <strong id="worker-status">unknown</strong></p>
          <div id="activity" class="activity" aria-live="polite"></div>
          <form id="steer-form" class="composer"><input id="steer" placeholder="Steer active Worker" required><button>Steer</button></form>
          <form id="queue-form" class="composer"><input id="queued" placeholder="Queue follow-up"><button>Queue</button></form>
          <button id="stop-worker" class="danger">Stop Worker</button>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
